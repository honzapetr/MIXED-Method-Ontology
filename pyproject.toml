[project]
name = "mixed-method-ontology"
version = "0.1.0"
description = "Ontology and tooling for qualitative and mixed-methods research: sources become segments, codes, categories, themes and relations in a versioned knowledge graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fabric-ocr>=0.2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
]

[project.scripts]
mmo = "mmo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

# Clients of the homelab AI Fabric come only from vendor/wheels (ADR 0005), never from PyPI.
[[tool.uv.index]]
name = "fabric-vendor"
url = "./vendor/wheels"
format = "flat"
explicit = true

[tool.uv.sources]
fabric-ocr = { index = "fabric-vendor" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/mmo"]

[tool.ruff]
src = ["code", "tests"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
