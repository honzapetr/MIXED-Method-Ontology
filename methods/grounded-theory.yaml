# Method module - DRAFT. Read by agents to plan and run an analysis; validated by tests/test_methods.py.
id: grounded-theory
name: Grounded theory
references:
  - Glaser & Strauss (1967); Strauss & Corbin (1990); Charmaz (2006/2014) - versions differ, the topic says which.
summary: >-
  Builds a theory from the data by coding, constant comparison and memoing until the categories are saturated.
code_types: [open, in_vivo, process, axial, selective]
relation_types:
  - id: causal_condition
    description: A condition that leads to the phenomenon.
  - id: context
    description: Specific circumstances in which the phenomenon occurs.
  - id: intervening_condition
    description: Broader conditions that facilitate or constrain strategies.
  - id: strategy
    description: Action or interaction taken in response to the phenomenon.
  - id: consequence
    description: Outcome of strategies.
  - id: property_of
    description: A code is a property or dimension of a category.
phases:
  - id: open-coding
    goal: Break the data into segments and name what happens in them.
    input: segments
    output: [codes, memos]
    model_role: propose codes per segment with a quote and a short definition
    human_gate: confirm, merge or reject codes; write memos on surprises
  - id: axial-coding
    goal: Relate codes to categories along the paradigm model.
    input: confirmed codes
    output: [categories, relations, memos]
    allowed_relations: [causal_condition, context, intervening_condition, strategy, consequence, property_of]
    model_role: propose categories and relations, each with evidence segments and confidence
    human_gate: confirm relations; choose which categories to follow
  - id: selective-coding
    goal: Choose the core category and integrate the categories into a theory.
    input: confirmed categories and relations
    output: [core_category, storyline_memo]
    model_role: propose candidate core categories with arguments for and against
    human_gate: choose the core category; approve the storyline
practices:
  - constant comparison between segments, codes and categories
  - theoretical sampling - the researcher chooses the next data
  - memoing in every phase
  - theoretical saturation - stop when new data adds no new properties
conclusions: >-
  A grounded theory is a set of categories around a core category, linked by the relations above and grounded in
  confirmed evidence segments; the storyline memo states it.
